# CANON_LEDGER.md 「🚫 인용 금지」의 **기계 대응물**.
# 🟥 산문 원장이 정본이고 이건 그 사본이다 — 갈리는 것이 이 하네스가 잡는 결함 클래스 자체라,
#    L1 이 매 실행 «원장 행 수 vs 여기 항목 수»를 대조하고 미커버를 UNCOVERED 로 이름 붙여 낸다.
# 🟥 **한글 낭독형을 반드시 같이 적는다** — 원장이 직접 기록한 사고: 「열세 개」가 아라비아 grep 을
#    통과했다(ASCII 계기를 한국어 코퍼스에 돌린 것과 같은 족).

banned:
  # 🟥 아래 두 항목은 **형식을 보이는 합성 예시**다. 이 자리에 «당신 프로젝트의» 금지 인용을
  #    적어라. 원본 하네스가 쓰던 실제 목록은 여기 없다 — 남의 원장 값을 배포본에 실으면
  #    그것은 예시가 아니라 남의 특화가 새어 들어온 것이다.
  - id: example-stale-metric
    literals: ["99% 정확도", "99 percent accurate"]
    ko_spoken: ["구십구 퍼센트"]     # ← 🟥 한글 낭독형을 «반드시» 같이 적는다. 아래 이유 참조
    why: "재측정에서 반증된 값 — 인용하려면 그 재측정을 먼저 대라"
  - id: example-retired-name
    literals: ["옛 제품명"]
    ko_spoken: []
    why: "은퇴한 명칭. 화면·낭독 양쪽에서 제거됐고 복귀는 별도 결정"

# ── retired — «리뷰가 걷어낸 낱말이 되돌아왔나» (L1-c) ─────────────────────────
# 🟥 실사고: 리뷰가 명시적으로 걷어내라 한 낱말이 **나흘 뒤 재유입됐고 아무 검사도
#    안 울렸다**(사람이 잡았다). `jargon_terms` 는 조어→풀이, 위 `banned` 는 수치 인용
#    금지를 다뤄서 «걷어낸 말» 을 담을 자리가 어디에도 없었다.
# 🟥 `banned` 와 기계는 같고 **처방이 다르다** — 폐어는 «대체어를 써라», 금지 인용은
#    «그 재측정을 대라». 그래서 태그(RETIRED)와 처방만 가르고 레인은 안 늘렸다.
# 🟥 `replacement` 를 비우지 마라 — 비우면 계기가 «처방 없는 판정이다»라고 스스로 적는다.
# ✅ 이 파일이 폐어를 «언급»하는 것은 위반이 아니다(USE↔MENTION). 원장이 자기를 신고하지 않는다.
retired:
  - id: example-retired-verb
    literals: ["옛동사하다"]
    ko_spoken: []              # 낭독형이 다르면 여기에
    replacement: "새동사하다"   # 🟥 처방. 비우면 판정만 있고 길이 없다
    why: "리뷰가 걷어낸 어휘 — 청중에게 낯설다"
    retired_by: "리뷰어/팀 이름"
    retired_at: "2026-08-25"


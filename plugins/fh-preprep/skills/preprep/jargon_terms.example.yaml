# jargon_terms.yaml — L5 「조어 렌즈」의 선언 목록.
#
# 🟥 이 레인은 «이 단어가 어렵다»를 판정하지 않는다. 그건 결론이고, 코드로 굳히면 천장이 된다
#    (FH CLAUDE.md §Mechanization Boundary). 이 레인이 재는 것은 **기록의 성질** 하나다 —
#    «선언된 조어가 낭독면 첫 등장에 풀이를 달고 있는가».
#    어느 단어를 조어로 볼지는 사람이 이 파일에 적는다. 기계는 그 선언을 집행만 한다.
#
# 🟥 왜 생겼나: 어휘 렌즈가 «없어서» 안 보인 자리가 있었다.
#    같은 날 발표 리뷰 2건 중 **구두 리뷰가 어휘를 지적했다**(3항 중 1항):
#    「잘 사용하지 않는 용어들이 많이 들어가 있어서 어려워 보인다」.
#    🟥 문서 리뷰(2건 중 나머지)는 **어휘를 아예 안 다뤘다** — 원장이 «입력은 둘이고 성격이
#    다르다. 섞어 읽으면 처방이 반대로 나온다» 고 명시한다. 초판이 이 자리에 «리뷰 2건의
#    최대 지적이 어휘» 라고 적었는데 그건 원장이 경고한 «섞어 읽기» 그 자체였고, 인용도
#    「보여요」로 한 글자 달랐다(직접인용은 원문 그대로여야 한다). 격리 그라운딩이 잡았다.
#    ⚠️ 초판에 있던 «첫 실사용에서 16건을 냈는데 어휘 지적 0건» 은 **출처를 못 찾아 뺐다** —
#    유일한 히트가 이식 전 원본 자신이라 자기참조였다. 거짓이라는 뜻이 아니라 대조할 것이 없다.
#    ⇒ 「없는 검사는 초록불로 보입니다」 — 이 덱 자신의 문장이 이 하네스에 그대로 적용됐다.
#
# gloss_window: 첫 등장 줄 기준 ±N 줄 안에 gloss 어휘가 있으면 «풀이됨»으로 인정한다.
#   2 인 이유: 낭독 한 문장이 보통 1~2줄이고, 풀이는 같은 문장이나 바로 다음 문장에 온다.
#   ⚠️ 이 값은 측정 없이 고른 것이다(n=1 코퍼스). 오탐이 나오면 그때 재본다.
gloss_window: 2

terms:
  # 🟥 아래는 **형식을 보이는 합성 예시**다. 여기에 «당신 발표의» 조어를 적어라.
  #    원본 하네스의 실제 선언 목록은 배포본에 안 싣는다 — 조어는 주제마다 다르고, 남의
  #    목록을 물려주면 «선언했는데 안 쓰는 어휘»가 생겨 이 레인의 0 이 거짓이 된다.
  # 🟥 키 이름은 코드가 읽는 그대로여야 한다: id · literals · plain · gloss · why.
  #    (초판이 term/gloss_hint/note 로 적었다가 `KeyError: 'literals'` 로 죽었다 —
  #     스펙의 예시가 그 구현을 뚫는 형태이고, 픽스처는 반드시 실물 스키마로 쓴다.)
  - id: isolation
    literals: ["격리"]              # 낭독면에서 찾을 표기. 여러 개면 나열한다
    plain: "서로 떼어 놓기"          # 권장 평문 — 사람이 고른다
    gloss: ["떼어", "따로", "분리"]  # 첫 등장 ±gloss_window 줄 안에 이 중 하나가 있으면 통과
    why: "일상어가 아니라 첫 등장에 풀이가 필요하다"
  - id: irreversible
    literals: ["비가역"]
    plain: "되돌릴 수 없는"
    gloss: ["되돌릴", "복구", "취소"]
    why: "한자어라 낭독으로 들으면 즉시 안 잡힌다"

name: Validate

on:
  # Every branch, not only main. Measured 2026-07-31: the consent-promotion branch accumulated a
  # 49-lane suite plus a merged PR (#212) without CI ever running on it — the lanes had been
  # executed ONLY on the author's machine, so "the lanes are green" and "the lanes are green
  # anywhere else" were never distinguished. A gate that only runs at the merge boundary cannot
  # tell an author their work depends on something only they have; it tells them at the end,
  # after the design is fixed. Cheap to widen: public repo, and the checks are fast and local.
  # NOT "no network" — an earlier draft of this line said that while the job below runs
  # `pip install pyyaml`, and a lane binds a loopback HTTP server. Both are disclosed at their own
  # steps; the claim is corrected here rather than left as a comment contradicting the file it
  # sits in (cross-family review, 2026-07-31).
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    # NO LOCALE PIN HERE — and its absence is a measured result, not an oversight.
    # The first CI run failed two ways (card-drift positives 0/4, ref-path 0 refs) and the
    # hypothesis was a Korean/emoji-vs-grep locale mismatch, so a run pinned LANG/LC_ALL=C.UTF-8
    # AND moved the ref-path extractor to python3. Outcome: ref-path passed, card-drift failed
    # IDENTICALLY. Since ref-path's fix is fully explained by the python3 move, the pin has zero
    # demonstrated effect and the locale hypothesis is REFUTED for card-drift. The manifest entry
    # that shipped the pin said in advance: "if it refutes, do NOT keep the locale pin as
    # decoration — remove it and re-diagnose." Removed. A knob kept because it might help is
    # indistinguishable from one that does, and the next reader would inherit it as a fact.
    # STILL OPEN, diagnosed only to the point the evidence reaches: the card-drift probe's
    # POSITIVE lanes return 0 on the runner and 3/3 here, and the failing set includes its ENGLISH
    # lane (P4) — so the common factor sits upstream of the Korean keywords, at the `(🔴|🟡)` line
    # selection or earlier, NOT in the absence-keyword regex. Next measurement is a linux
    # reproduction, not another guess.
    steps:
      - uses: actions/checkout@v4


      # 🟥 zsh 를 설치한다 — 장식이 아니라 **커버리지 구멍을 닫는 것**이다.
      # 2026-08-21 실측: `psa_scan_tagged` 가 `local path` 때문에 **zsh 에서만** 죽었고 그 죽음이
      # 「깨끗한 스캔」과 바이트 동일이었다(유출 스캐너가 무음 통과). 그 축의 레인(Z1~Z4 ·
      # E2~E5/zsh)은 `command -v zsh` 조건부라 zsh 없는 러너에서 **8개가 통째로 SKIP** 된다 —
      # 즉 그 결함을 고친 PR 이 CI 에서 **한 번도 검증되지 않는다.** macOS 기본 셸이 zsh 이고
      # public-surface-audit 스킬 본문이 그 셸로 실행되므로 이건 **소비자 표면**이다.
      # ⚠️ 스킵은 실패가 아니라 레인 플로어가 조건부로 계산된다 — 그래서 이 설치가 없어도 CI 는
      #    초록인데, **그 초록이 이 축에 대해서는 미측정**이다. 그 구별이 이 스텝의 존재 이유다.
      - name: Install zsh (second shell arm for the psa lanes — see comment)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
          zsh --version
      - name: Check for operator-private token residue
        run: |
          # `set +e` is deliberate and load-bearing: every command below has its exit code read
          # EXPLICITLY. GitHub's default `bash -e` would abort the step on grep's legitimate
          # "no match" (1), which is precisely the status this check must be able to tell apart
          # from grep's "error" (2).
          set -uo pipefail
          set +e
          echo "=== Scanning for generic operator-private patterns ==="
          # Named internal-vocabulary terms (employer / product / sister-hub names) are
          # deliberately NOT listed here — naming them in this public workflow would itself
          # leak them (the exact flaw this check existed to prevent). That role moved to the
          # local pre-commit skill /public-surface-audit, which sources its term list from a
          # gitignored file (.claude/rules/.public-surface-patterns). CI keeps only generic,
          # name-free patterns that are safe to appear on the public surface.
          #
          # 🟥 WHY THIS STEP IS SHAPED LIKE THIS (measured 2026-08-22, three arms, one variable
          # at a time). The previous form was `FOUND=$(grep … || true)` + `[ -n "$FOUND" ]`:
          #   leak present · instrument healthy   rc=1  FAIL: … residue found          ✅
          #   clean tree                          rc=0  PASS: no … residue             ✅
          #   leak present · grep exits 2         rc=0  PASS: no … residue             🟥
          # `|| true` folds grep's ERROR (2) into its NO-MATCH (1), so a dead instrument renders
          # byte-identically to a clean surface. That is the absence-assertion class — the PASS
          # token is produced on the failure branch — and it sat on the ONE required check of this
          # repo, guarding an IRREVERSIBLE surface (a leak does not un-happen), with zero controls.
          #
          # Two closures, both copied from an instrument this repo already runs
          # (scripts/env_purity_scan.sh §"컨트롤 사망" — control dead → verdict void, exit 10):
          #   ① grep's own exit code is READ. rc >= 2 is an instrument error, never a clean scan.
          #   ② a KNOWN-POSITIVE control is planted in the scanned tree, and the scan must FIND it.
          #      Zero control hits means the scan did not actually run over this tree — the
          #      include/exclude flags, the path argument or the pattern itself is dead — and a
          #      "0 real hits" result from a scan that cannot find a planted leak is not evidence
          #      of a clean surface. The control is generated HERE rather than committed: a tracked
          #      file carrying a literal home path is itself blocked by the local pre-commit
          #      confidentiality scan (verified 2026-08-22 — it reports MED on exactly that shape).
          CTL_FILE="./.ci_leak_scan_control.md"
          CTL_USER="ci-control-fixture"
          trap 'rm -f "$CTL_FILE"' EXIT
          {
            echo "CONTROL FIXTURE — generated by the Validate workflow, deleted when the step ends."
            echo "It exists so this scan cannot report a clean surface while being dead."
            printf '/Users/%s/projects/example\n' "$CTL_USER"
          } > "$CTL_FILE"

          out=$(grep -rIE \
            -e "/Users/[a-z0-9_-]+/" \
            --include="*.md" --include="*.json" --include="*.zsh" --include="*.sh" \
            --exclude-dir=".git" \
            .)
          rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "❌ INSTRUMENT ERROR — grep exited $rc (neither 0=match nor 1=no-match)."
            echo "   NOT SCANNED. Refusing to render an un-run scan as a clean surface."
            printf '%s\n' "$out"
            exit 10
          fi

          # ① control liveness is asked FIRST — until the control is seen, an empty result set is
          #    ambiguous between "nothing to find" and "nothing was looked at".
          ctl=$(printf '%s\n' "$out" | grep -cF -- "$CTL_FILE:")
          crc=$?
          if [ "$crc" -ge 2 ]; then
            echo "❌ INSTRUMENT ERROR — the control partition itself failed (grep rc=$crc). NOT SCANNED."
            exit 10
          fi
          case "$ctl" in (*[!0-9]*|'') ctl=0 ;; esac
          if [ "$ctl" -eq 0 ]; then
            echo "⛔ INSTRUMENT DEAD — the planted known-positive control ($CTL_FILE) was NOT found"
            echo "   by this scan. The scan did not run over this tree, so its 0 findings are void."
            echo "   (Do not 'fix' this by deleting the control — it is the only thing separating a"
            echo "    clean surface from a dead scanner.)"
            exit 10
          fi

          # ② real hits = every hit that is not the control. `out` is non-empty here by
          #    construction (it contains at least the control line), so this filter cannot turn an
          #    empty result into a phantom finding.
          real=$(printf '%s\n' "$out" | grep -vF -- "$CTL_FILE:" | grep -v '^[[:space:]]*$')
          if [ -n "$real" ]; then
            echo "FAIL: operator-private token residue found (absolute home path):"
            printf '%s\n' "$real"
            exit 1
          fi
          echo "PASS: no generic operator-private residue (control alive: $ctl hit(s))"

      - name: Validate plugin.json required fields
        run: |
          echo "=== Validating plugin.json files ==="
          python3 .github/scripts/validate_plugins.py

      - name: Validate marketplace.json structure
        run: |
          echo "=== Validating marketplace.json ==="
          python3 .github/scripts/validate_marketplace.py

      - name: Check skill count consistency
        run: |
          echo "=== Checking skill counts (merge-boundary gate) ==="
          # gate-locality close (fh_signal_2026-06-21): this step is the gate at the MERGE
          # boundary — the path that actually broke (PR #111 merged green because the old
          # step counted directories incl. deprecated and only WARNed). It now runs the SAME
          # single-source check the local pre-commit hook + selfcheck/publish run, and FAILS
          # hard on drift across all 5 declarations (plugin.json ×2 · marketplace.json ·
          # README header · local_fh_context). count_check uses active-skill (non-deprecated)
          # semantics, so it cannot pass on a directory miscount.
          bash scripts/count_check.sh

      # Kept as its own step even though selfcheck.sh below also runs count_check.sh. That is a
      # decision, not residue: this step is the documented merge-boundary gate for the PR #111
      # incident, and it must survive any future edit to selfcheck's step list. It also names the
      # failure precisely in the CI UI instead of burying it in a 100-line log.

      - name: Lane-suite runtime prerequisites
        run: |
          # ASK THE INTERPRETER, DO NOT PATTERN-MATCH THE SOURCE. The first draft of this step
          # gated the install on `grep -rqlE '^[[:space:]]*import yaml' scripts/`. Cross-family
          # review refuted it against this very repo: scripts/validate_yaml.sh:42 reads
          # `import sys, yaml`, which that pattern does not match — so the step would print
          # "nothing to install" while a script on the ref imports yaml. It also could not tell
          # grep's "no match" (1) from grep's "error" (2), folding a broken scan into the clean
          # branch. That is the same divergent-parser / false-clean shape FH keeps closing
          # elsewhere, reproduced here in a five-line CI step.
          #
          # The reliable question is not "does some file look like it imports yaml" but "can this
          # interpreter import yaml", and python answers it directly. Fail-closed: if the import
          # is still unavailable after the install attempt, the step FAILS rather than letting a
          # lane discover it later as a mystery red.
          if python3 -c "import yaml" 2>/dev/null; then
            echo "pyyaml already available"
          else
            # PINNED — but only on the INSTALL path. If the runner image already ships an
            # importable PyYAML, the check above short-circuits and that preinstalled version is
            # what runs; this pin does not override it. Stated rather than left implied, because
            # "pinned" reads as a stronger guarantee than the code gives. Pinning the install still
            # removes the drift that matters here (a fresh install picking a new major).
            echo "pyyaml missing — installing (pinned)"
            python3 -m pip install --quiet --disable-pip-version-check 'pyyaml==6.0.2'
          fi
          python3 -c "import yaml; print('pyyaml', yaml.__version__)"
          python3 -c "import sys; print('python', sys.version.split()[0])"
          node -v

      # 🟥 배선 (2026-08-29) — 이 워크플로가 **이 스크립트를 위해 pyyaml 을 설치하면서
      # 정작 그것을 안 돌리고 있었다.** 위 단계의 주석이 `scripts/validate_yaml.sh:42` 를
      # 이유로 대는데, 레포 전체에 그 파일의 실행 호출자가 0개였다 — 타계열 감사(codex,
      # 2026-08-29)가 «호출자 0인 산문 floor» 5종 중 1순위로 지목했고 컨트롤(없는 이름 = 0히트)
      # 동반으로 대조 확인했다. `AGENTS.md:36-43` 은 이것이 strict-runtime frontmatter 를
      # 지킨다고 적는다 — 그 주장이 참이 되려면 무언가가 실제로 불러야 한다.
      #
      # 왜 여기인가(gate-locality): frontmatter 가 깨지면 그 **아래**에 선언된 `tools:` 와
      # `model:` 하드 플로어가 통째로 무효가 되는데(measured: quench-challenger.md 가
      # read-only 선언을 달고 전 도구로 돌고 있었다), CC 자신의 로더는 관대해서 **로컬에선
      # 안 보인다.** 즉 저자 머신이 구조적으로 못 잡는 결함이라 CI 가 맞는 자리다.
      # 배선 시점 실측: 41 skills + 8 agents 전부 파싱, rc=0 — 배선이 CI 를 적색으로 만들지 않는다.
      - name: SKILL/agent frontmatter parses (strict-runtime portability)
        run: |
          bash scripts/validate_yaml.sh

      - name: Selfcheck (mandatory-pass surface + every wired lane suite)
        run: |
          echo "=== scripts/selfcheck.sh — the same command npm test and prepublishOnly run ==="
          # THE ANCHOR THIS WORKFLOW WAS MISSING. selfcheck is FH's mandatory-pass surface: it
          # syntax-checks every shipped executable and runs all wired lane suites (fh-gate
          # regressions, pre-push stdin integrity, degrade-scan probes, session-close lanes,
          # package coverage, and the consent-registry floor once that branch lands).
          # Until 2026-07-31 it ran at exactly two boundaries — `npm test` and `prepublishOnly` —
          # both of which execute on the author's machine. CI validated plugin.json, marketplace
          # .json and skill counts, i.e. metadata, and never the executable surface those lanes
          # exist to hold. The lanes were a floor that had never been stood on by anyone else.
          # CORRECTED CLAIM (cross-family review, 2026-07-31): the first version of this comment
          # said selfcheck is "hermetic by construction ... no network". That was FALSE, and it was
          # false in the direction that matters — it asserted an absence of environment dependence
          # while the step below has some. The first correction then UNDER-corrected, claiming "no
          # REMOTE network"; round-3 review refuted that too, by path: selfcheck runs the
          # session-close lanes, which run session_close_check.sh without masking `gh`, and that
          # script calls `gh pr list --author @me`. On an authenticated host selfcheck DOES contact
          # GitHub. Stated plainly rather than narrowed a third time.
          # WHAT SELFCHECK ACTUALLY NEEDS: python3, node, curl, `timeout`
          # (scripts/test_sidecar_wait_stdin.sh requires it), loopback bind permission
          # (test_ollama_panel_lanes.sh starts a stub HTTP server on 127.0.0.1:18011), git, and
          # optionally `gh`. Precisely on `gh`: session_close_check.sh branches on the BINARY being
          # present, not on auth — an unauthenticated `gh` still enters the branch and its failure
          # is swallowed by `2>/dev/null`, yielding zero PRs. So CI is green without a token, but
          # the reason is suppressed failure, not a separate no-gh path. (An earlier version of
          # this comment said "no-gh path"; that was imprecise.)
          # All hold on ubuntu-latest; they did not hold in the reviewer's sandbox, where five lanes
          # failed for the loopback reason alone.
          # NAMED RESIDUAL: if a future runner or a hardened sandbox forbids loopback binding, that
          # lane FAILS rather than skipping — a red CI, not a silent pass. That is the correct
          # direction, and it is written here so the next reader diagnoses it in one step instead
          # of trusting a claim of hermeticity this file used to make.

          bash scripts/selfcheck.sh

      # ── 플로어 없는 채널의 4축 마커 (2026-09-14 신설) ─────────────────────────
      # 4축 게이트의 증거(마커)는 `tracks/**` 에 살고 그건 **gitignored** 다. 저작 노드가 이
      # 레포의 작업 트리면 맞는 설계다 — 마커는 로컬에 남고 사람이 읽는다.
      # 🟥 그런데 원격 자율 노드(클라우드 세션)는 작업 트리가 휘발한다. `claude/*` 브랜치가
      #    FH 자산을 커밋하면 마커가 그 체크아웃과 함께 사라지고, 이 워크플로는 gitignored
      #    파일을 **구조적으로 못 본다** — 즉 마커 없는 FH 자산 커밋이 **초록으로** 들어온다.
      #    실측 2026-09-14, `claude/` 접두사 머지 PR 전수: #675·#716 **2/2 마커 없음**.
      #    그리고 그 채널은 주간 캐이던스로 매주 돈다(self_evolution_routine.md §5).
      # 이 스텝은 **그 채널에만** 건다. 보통 브랜치는 pre-commit 이 이미 하드 차단하므로
      # 여기서 또 물으면 만족 불가능한 이중 요구가 되고, 그건 override 를 훈련시킨다.
      # 🟥 형식만 본다 — 값의 진위도 enum 멤버십도 안 본다(enum 정본은 저작 노드의 훅).
      - name: Floorless-channel 4-axis marker (claude/* branches touching FH assets)
        env:
          RMG_CHANNEL_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          # 얕은 클론이라 base 를 직접 받아온다. 못 받으면 그건 HARNESS-ERROR 로 떨어져야지
          # «비교할 게 없다 → 통과» 로 접히면 안 된다.
          git fetch --no-tags --depth=50 origin main 2>/dev/null || true
          BODY_FILE=""
          if [ -n "${PR_BODY:-}" ]; then
            BODY_FILE="$RUNNER_TEMP/pr_body.txt"
            printf '%s' "$PR_BODY" > "$BODY_FILE"
          fi
          RMG_BASE_REF=origin/main RMG_HEAD_REF=HEAD RMG_BODY_FILE="$BODY_FILE" \
            bash scripts/remote_marker_gate.sh
          rc=$?
          # 10 = 계기 고장. 조용한 통과가 아니라 빨강으로 띄운다.
          if [ "$rc" -eq 10 ]; then
            echo "::error::remote_marker_gate HARNESS-ERROR — 계기가 고장났다(미측정 ≠ 통과)"
          fi
          exit $rc
